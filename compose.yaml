# Two 3-node Elasticsearch clusters (A and B), each with its own Kibana.
# Normally driven by ./ece; plain `docker compose ps|logs` work too.

x-es-node: &es-node
  image: ece-elasticsearch:${ES_VERSION}
  depends_on:
    certs:
      condition: service_completed_successfully
  environment: &es-env
    ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    ES_JAVA_OPTS: -Xms${ES_HEAP} -Xmx${ES_HEAP}
  ulimits:
    nofile: { soft: 65535, hard: 65535 }
  healthcheck:
    test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'"]
    interval: 10s
    timeout: 10s
    retries: 60

x-kibana: &kibana
  image: docker.elastic.co/kibana/kibana:${ES_VERSION}
  depends_on:
    certs:
      condition: service_completed_successfully
  volumes:
    - certs:/usr/share/kibana/config/certs:ro
  environment: &kibana-env
    ELASTICSEARCH_USERNAME: kibana_system
    ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
    ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: config/certs/ca/ca.crt
    TELEMETRY_OPTIN: "false"
    XPACK_SECURITY_ENCRYPTIONKEY: ece-lab-security-key-0123456789abcdef
    XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ece-lab-saved-objects-key-0123456789ab
    XPACK_REPORTING_ENCRYPTIONKEY: ece-lab-reporting-key-0123456789abcdef

services:
  certs:
    image: ece-elasticsearch:${ES_VERSION}
    build:
      context: docker
      args:
        ES_VERSION: ${ES_VERSION}
    user: "0"
    entrypoint: ["/usr/share/elasticsearch/ece/gen-certs.sh"]
    command: []
    volumes:
      - certs:/certs

  es-a1:
    <<: *es-node
    hostname: es-a1
    environment: { <<: *es-env, NODE_NAME: es-a1 }
    ports: ["127.0.0.1:${ES_A_PORT}:9200"]
    volumes: [certs:/usr/share/elasticsearch/config/certs:ro, data-a1:/usr/share/elasticsearch/data, snapshots:/usr/share/elasticsearch/snapshots]
  es-a2:
    <<: *es-node
    hostname: es-a2
    environment: { <<: *es-env, NODE_NAME: es-a2 }
    volumes: [certs:/usr/share/elasticsearch/config/certs:ro, data-a2:/usr/share/elasticsearch/data, snapshots:/usr/share/elasticsearch/snapshots]
  es-a3:
    <<: *es-node
    hostname: es-a3
    environment: { <<: *es-env, NODE_NAME: es-a3 }
    volumes: [certs:/usr/share/elasticsearch/config/certs:ro, data-a3:/usr/share/elasticsearch/data, snapshots:/usr/share/elasticsearch/snapshots]

  es-b1:
    <<: *es-node
    hostname: es-b1
    environment: { <<: *es-env, NODE_NAME: es-b1 }
    ports: ["127.0.0.1:${ES_B_PORT}:9200"]
    volumes: [certs:/usr/share/elasticsearch/config/certs:ro, data-b1:/usr/share/elasticsearch/data, snapshots:/usr/share/elasticsearch/snapshots]
  es-b2:
    <<: *es-node
    hostname: es-b2
    environment: { <<: *es-env, NODE_NAME: es-b2 }
    volumes: [certs:/usr/share/elasticsearch/config/certs:ro, data-b2:/usr/share/elasticsearch/data, snapshots:/usr/share/elasticsearch/snapshots]
  es-b3:
    <<: *es-node
    hostname: es-b3
    environment: { <<: *es-env, NODE_NAME: es-b3 }
    volumes: [certs:/usr/share/elasticsearch/config/certs:ro, data-b3:/usr/share/elasticsearch/data, snapshots:/usr/share/elasticsearch/snapshots]

  kibana-a:
    <<: *kibana
    hostname: kibana-a
    environment:
      <<: *kibana-env
      SERVER_NAME: kibana-a
      SERVER_PUBLICBASEURL: http://localhost:${KIBANA_A_PORT}
      ELASTICSEARCH_HOSTS: '["https://es-a1:9200","https://es-a2:9200","https://es-a3:9200"]'
    ports: ["127.0.0.1:${KIBANA_A_PORT}:5601"]
  kibana-b:
    <<: *kibana
    hostname: kibana-b
    environment:
      <<: *kibana-env
      SERVER_NAME: kibana-b
      SERVER_PUBLICBASEURL: http://localhost:${KIBANA_B_PORT}
      ELASTICSEARCH_HOSTS: '["https://es-b1:9200","https://es-b2:9200","https://es-b3:9200"]'
    ports: ["127.0.0.1:${KIBANA_B_PORT}:5601"]

volumes:
  certs:
  snapshots:
  data-a1:
  data-a2:
  data-a3:
  data-b1:
  data-b2:
  data-b3:
