cluster.name: cluster-b
node.name: es-b3

network.host: 0.0.0.0
discovery.seed_hosts: ["es-b1", "es-b2", "es-b3"]
cluster.initial_master_nodes: ["es-b1", "es-b2", "es-b3"]

# Custom node attributes for shard allocation filtering and awareness
node.attr.zone: zone-3
node.attr.temp: warm

# Snapshot repositories must be registered under this path
path.repo: ["/usr/share/elasticsearch/snapshots"]

xpack.license.self_generated.type: trial

xpack.security.enabled: true
xpack.security.http.ssl.enabled: true
xpack.security.http.ssl.key: certs/es-b3/es-b3.key
xpack.security.http.ssl.certificate: certs/es-b3/es-b3.crt
xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
xpack.security.transport.ssl.enabled: true
xpack.security.transport.ssl.key: certs/es-b3/es-b3.key
xpack.security.transport.ssl.certificate: certs/es-b3/es-b3.crt
xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
xpack.security.transport.ssl.verification_mode: certificate

# Remote cluster server (API key based remote clusters, port 9443)
remote_cluster_server.enabled: true
remote_cluster.port: 9443
xpack.security.remote_cluster_server.ssl.enabled: true
xpack.security.remote_cluster_server.ssl.key: certs/es-b3/es-b3.key
xpack.security.remote_cluster_server.ssl.certificate: certs/es-b3/es-b3.crt
xpack.security.remote_cluster_client.ssl.enabled: true
xpack.security.remote_cluster_client.ssl.certificate_authorities: certs/ca/ca.crt
